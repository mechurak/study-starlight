name: Deploy to GitHub Pages

# GitHub Pages를 쓰려면 저장소 이름·site 설정을 확인하고 Pages의 Source를 GitHub Actions로 바꾼다.
# 아래 push·branches 두 줄의 주석을 해제하면 main에 push할 때마다 배포한다.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 랜딩 카드의 마지막 수정일을 계산할 전체 Git 이력.
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          build-cmd: npm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
