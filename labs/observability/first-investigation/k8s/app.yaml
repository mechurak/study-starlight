apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: observability-lab
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: observability-lab-app:0.1.0
          imagePullPolicy: Never
          env:
            - name: OTEL_SERVICE_NAME
              value: checkout-lab
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=study,deployment.environment.name=lab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lgtm:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: health
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
