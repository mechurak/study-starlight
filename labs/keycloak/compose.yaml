name: keycloak-lab

services:
  samba:
    image: keycloak-lab-samba:4.19.5-ubuntu24.04
    build:
      context: ./samba
      args:
        UBUNTU_IMAGE: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
        SAMBA_PACKAGE_VERSION: 2:4.19.5+dfsg-4ubuntu9.7
    container_name: keycloak-lab-samba
    hostname: dc1
    domainname: ad.keycloak.test
    environment:
      SAMBA_REALM: AD.KEYCLOAK.TEST
      SAMBA_DOMAIN: KEYCLOAK
      SAMBA_HOST_NAME: DC1
      SAMBA_DNS_FORWARDER: 127.0.0.11
    cap_add:
      - SYS_ADMIN
    secrets:
      - samba_admin_password
      - samba_alice_password
      - samba_bob_password
      - samba_tls_key
    volumes:
      - keycloak-lab-samba-data:/var/lib/samba
      - ./.state/directory-ca/ca.crt:/run/keycloak-lab/certs/ca.crt:ro
      - ./.state/directory-ca/dc1.crt:/run/keycloak-lab/certs/dc1.crt:ro
    networks:
      keycloak-lab:
        ipv4_address: 172.30.0.10
        aliases:
          - dc1.ad.keycloak.test
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          LDAPTLS_CACERT=/run/keycloak-lab/certs/ca.crt
          ldapsearch -LLL -x -H ldaps://dc1.ad.keycloak.test:636
          -D Administrator@AD.KEYCLOAK.TEST
          -w "$$(cat /run/secrets/samba_admin_password)"
          -b '' -s base defaultNamingContext >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    container_name: keycloak-lab-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password
    volumes:
      - keycloak-lab-postgres-data:/var/lib/postgresql
    networks:
      keycloak-lab:
        aliases:
          - postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=keycloak --dbname=keycloak
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    cpus: 0.5
    mem_limit: 512m
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    container_name: keycloak-lab-keycloak
    entrypoint:
      - /opt/keycloak/bin/keycloak-lab-entrypoint
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://keycloak.keycloak.test:30080
      KC_HTTPS_PORT: "30080"
      KC_HTTPS_CERTIFICATE_FILE: /run/keycloak-lab/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/secrets/keycloak_https_key
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KEYCLOAK_LAB_LOCAL_USER_USERNAME: local-user
    secrets:
      - keycloak_db_password
      - keycloak_bootstrap_admin_password
      - keycloak_https_key
      - keycloak_local_user_password
    volumes:
      - ./keycloak/entrypoint.sh:/opt/keycloak/bin/keycloak-lab-entrypoint:ro
      - ./keycloak/study-realm.json:/opt/keycloak/data/import/study-realm.json:ro
      - ./.state/web-ca/keycloak.crt:/run/keycloak-lab/certs/keycloak.crt:ro
      - ./.state/directory-ca/ca.crt:/opt/keycloak/conf/truststores/directory-ca.crt:ro
      - ./.state/web-ca/ca.crt:/opt/keycloak/conf/truststores/web-ca.crt:ro
    networks:
      keycloak-lab:
        ipv4_address: 172.30.0.20
        aliases:
          - keycloak.keycloak.test
    ports:
      - name: keycloak-https
        target: 30080
        published: "30080"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3;
          grep -q 'HTTP/1.0 200' <&3
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s
    cpus: 1.5
    mem_limit: 2g
    stop_grace_period: 30s

  diagnostic:
    image: keycloak-lab-samba:4.19.5-ubuntu24.04
    container_name: keycloak-lab-diagnostic
    profiles:
      - diagnostic
    entrypoint:
      - /run/keycloak-lab/diagnostic/verify-compose.sh
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - samba_admin_password
      - samba_alice_password
      - samba_bob_password
    volumes:
      - ./scripts/verify-compose.sh:/run/keycloak-lab/diagnostic/verify-compose.sh:ro
      - ./.state/directory-ca/ca.crt:/run/keycloak-lab/directory-ca/ca.crt:ro
      - ./.state/web-ca/ca.crt:/run/keycloak-lab/web-ca/ca.crt:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - keycloak-lab
    depends_on:
      samba:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 256m

  app-a-seed:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    profiles:
      - p06
    entrypoint:
      - /bin/bash
      - /run/keycloak-lab/seed/seed-app-a.sh
    user: "1000:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - keycloak_bootstrap_admin_password
      - app_a_client_secret
    volumes:
      - ./keycloak/seed-app-a.sh:/run/keycloak-lab/seed/seed-app-a.sh:ro
      - ./.state/web-ca/ca.crt:/run/keycloak-lab/web-ca/ca.crt:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - keycloak-lab
    depends_on:
      keycloak:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 256m

  app-a:
    image: keycloak-lab-app:node24
    build:
      context: ./app
      args:
        NODE_IMAGE: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    container_name: keycloak-lab-app-a
    environment:
      APP_NAME: App A
      APP_ORIGIN: https://app-a.keycloak.test:30081
      APP_PORT: "30081"
      OIDC_ISSUER: https://keycloak.keycloak.test:30080/realms/study
      OIDC_CLIENT_ID: app-a
      OIDC_CLIENT_SECRET_FILE: /run/secrets/app_a_client_secret
      SESSION_SECRET_FILE: /run/secrets/app_a_session_secret
      SESSION_COOKIE_NAME: app-a.sid
      HTTPS_CERTIFICATE_FILE: /run/keycloak-lab/certs/app-a.crt
      HTTPS_KEY_FILE: /run/secrets/app_a_https_key
      API_ORIGIN: http://api:3000
      NODE_EXTRA_CA_CERTS: /run/keycloak-lab/web-ca/ca.crt
    secrets:
      - app_a_client_secret
      - app_a_session_secret
      - app_a_https_key
    volumes:
      - ./.state/web-ca/ca.crt:/run/keycloak-lab/web-ca/ca.crt:ro
      - ./.state/web-ca/app-a.crt:/run/keycloak-lab/certs/app-a.crt:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      keycloak-lab:
        aliases:
          - app-a.keycloak.test
    ports:
      - name: app-a-https
        target: 30081
        published: "30081"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    cpus: 0.25
