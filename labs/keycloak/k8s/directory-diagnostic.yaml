apiVersion: v1
kind: Pod
metadata:
  name: directory-diagnostic
  namespace: keycloak-lab
  labels:
    app.kubernetes.io/name: directory-diagnostic
    app.kubernetes.io/part-of: keycloak-lab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: diagnostic
      image: keycloak-lab-samba:4.19.5-ubuntu24.04
      imagePullPolicy: Never
      command:
        - /bin/sh
        - -c
        - trap 'exit 0' TERM INT; while :; do sleep 3600; done
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      volumeMounts:
        - name: directory-ca
          mountPath: /run/keycloak-lab/directory-ca
          readOnly: true
        - name: bind-passwords
          mountPath: /run/keycloak-lab/secrets
          readOnly: true
        - name: diagnostic-script
          mountPath: /run/keycloak-lab/diagnostic
          readOnly: true
  volumes:
    - name: directory-ca
      configMap:
        name: directory-ca
        defaultMode: 0444
    - name: bind-passwords
      secret:
        secretName: directory-diagnostic-bind
        defaultMode: 0444
    - name: diagnostic-script
      configMap:
        name: directory-diagnostic-script
        defaultMode: 0555
